## debian-security-readback configuration, /etc/debian-security-readback.toml by default.
## Every key is optional, and every line below shows its default. Flags on the command line
## (--host, --release, --cache-dir, --out-dir, --fail-on) win over this file.

## The name the report carries. Empty: the kernel's node name.
# host = ""

## The Debian release to read fixes for, by codename. Empty: VERSION_CODENAME from /etc/os-release.
# release = ""

## Where the tracker's files are kept between runs (about 90 MB), and where report.json and
## report.md are written. Absolute paths. Each must belong to the running user and not be writable by
## group or others; a missing one is created with mode 0755.
# cache_dir = "/var/cache/debian-security-readback"
# out_dir = "/var/lib/debian-security-readback"

## The tracker's DSA list and its JSON. A mirror works, and so does a file:// URL for a host with no
## way out: copy both files there some other way.
# dsa_list_url = "https://salsa.debian.org/security-tracker-team/security-tracker/-/raw/master/data/DSA/list"
# tracker_url = "https://security-tracker.debian.org/tracker/data/json"

## A cached copy younger than this is used as it is. An older one is downloaded again, and kept (with
## a warning in the report) when the download fails.
# cache_max_age_hours = 20

## A download that takes longer than this counts as failed (1 or more). Every read waits at most the
## time that is left, so a slow server cannot stretch it.
# download_deadline_seconds = 300

## The largest download accepted, in MiB. The DSA list is about 1.3 MB and the tracker's JSON about
## 90 MB (November 2026); anything far larger is not what it claims to be.
# dsa_list_max_mib = 64
# tracker_max_mib = 512

## How long dpkg-query, apt-cache, apt-mark, docker or incus may take, each call (1 or more). A dpkg or
## apt call that runs out fails the readback; a docker or incus one skips that check.
# command_timeout_seconds = 120

## The mode of report.json and report.md (an octal number). The reports name packages that wait for a
## fix, so they are not world-readable by default.
# report_mode = 0o640

## The report counts the active fixes published in the last this many days.
# recent_days = 30

## Regular expressions searched in each cgroup path of /proc/<pid>/cgroup that mark a process of a
## container. Its files are the container's, not the host's, so its deleted libraries are not the
## host's pending restarts. Each pattern matches whole path components, so docker.service or
## incus.service (host daemons) never match. Add a pattern for any other runtime you run; setting the
## key replaces the whole list.
# container_cgroup_patterns = [
#   '(^|/)docker-[0-9a-f]{64}\.scope(/|$)',
#   '(^|/)docker/[0-9a-f]{64}(/|$)',
#   '(^|/)libpod-[0-9a-f]{64}\.scope(/|$)',
#   '(^|/)libpod_parent/libpod-[0-9a-f]{64}(/|$)',
#   '(^|/)crio-[0-9a-f]{64}\.scope(/|$)',
#   '(^|/)cri-containerd-[0-9a-f]{64}\.scope(/|$)',
#   '(^|/)kubepods[^/]*(/|$)',
#   '(^|/)lxc\.payload\.[^/]+(/|$)',
#   '(^|/)machine\.slice/[^/]+/payload(/|$)',
# ]

## Check running Docker containers and Incus instances against their images. Skipped quietly when the
## command is not installed or does not answer.
# docker = true
# incus = true

## Exit 3 (instead of 0) when any fix is in one of these states, for a CI job or a monitor that should
## go red. States: blocked, installed_pending_activation, available, active.
# fail_on = []
